# Builds the APK and publishes it to the website (docs/downloads) on the main branch.
#
# Use it:  git tag v1.1 && git push origin v1.1
# or run it by hand from the Actions tab (Run workflow).
name: Build APK for website

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Keep the APK as a workflow download too
        uses: actions/upload-artifact@v4
        with:
          name: Smrti-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Check out the website branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Publish to docs/downloads
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd site
          ./scripts/publish-apk.sh ../app/build/outputs/apk/debug/app-debug.apk "$VERSION" \
            "$(sed -n '/^## /{n;:a;/^- /{s/^- //;p};n;/^## /q;ba}' CHANGELOG.md | head -1)"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          git commit -m "Publish Smrti $VERSION" || echo "nothing to commit"
          git push origin main
